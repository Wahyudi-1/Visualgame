<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game AR: Makan Jatuh</title>

    <!-- Pustaka MediaPipe untuk Deteksi Wajah -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700&display=swap');

        :root {
            --p1-color: #FF6B6B; /* Merah untuk P1 */
            --p2-color: #4ECDC4; /* Tosca untuk P2 */
            --dark: #292F36;
            --light: #F7FFF7;
            --warning: #FFE66D;
        }

        body {
            margin: 0; padding: 0;
            background-color: var(--dark); color: var(--light);
            font-family: 'Nunito', sans-serif;
            overflow: hidden; display: flex; justify-content: center; align-items: center;
            height: 100vh;
        }

        #game-container {
            position: relative; width: 100%; max-width: 900px; height: 100vh; max-height: 800px;
            background: #000; box-shadow: 0 0 20px rgba(0,0,0,0.5); overflow: hidden;
        }

        video { display: none; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }

        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(41, 47, 54, 0.9); z-index: 10;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; padding: 20px; box-sizing: border-box; transition: opacity 0.3s;
        }

        .hidden { display: none !important; }

        h1, h2 { font-family: 'Fredoka One', cursive; margin-bottom: 10px; letter-spacing: 1px; color: var(--warning); }
        h1 { font-size: 2.5rem; text-shadow: 3px 3px 0px #C93838; }

        p { font-size: 1.1rem; max-width: 600px; line-height: 1.5; margin-bottom: 20px; }

        .instruction-box {
            background: rgba(255,255,255,0.1); padding: 15px 25px; border-radius: 15px;
            border: 2px dashed var(--warning); margin-bottom: 25px; width: 80%;
        }

        /* Pilihan Mode Permainan */
        .mode-selector {
            display: flex; justify-content: center; gap: 15px; margin-bottom: 20px;
        }
        
        .mode-btn {
            padding: 10px 25px; font-size: 1.1rem; background: #555; color: white;
            border-radius: 20px; cursor: pointer; border: none; font-family: 'Fredoka One', cursive;
            box-shadow: 0 4px 0px #333; transition: all 0.2s;
        }
        
        .mode-btn.active-mode {
            background: var(--p2-color); box-shadow: 0 4px 0px #2A9D8F; color: var(--dark);
        }

        .input-group {
            display: flex; gap: 15px; margin-bottom: 20px; width: 100%; justify-content: center; flex-wrap: wrap;
        }

        input[type="text"] {
            padding: 12px 20px; font-size: 1.1rem; border: 3px solid transparent; border-radius: 25px;
            outline: none; width: 200px; text-align: center; font-family: 'Fredoka One', cursive; color: var(--dark);
            transition: all 0.3s;
        }
        
        #player1-name { border-color: var(--p1-color); }
        #player2-name { border-color: var(--p2-color); display: none; /* Sembunyikan P2 di awal (Mode Solo) */ }

        button.main-btn {
            padding: 15px 40px; font-size: 1.2rem; font-family: 'Fredoka One', cursive;
            border: none; border-radius: 30px; background-color: var(--warning); color: var(--dark);
            cursor: pointer; box-shadow: 0 5px 0px #B8A34A; transition: transform 0.1s, box-shadow 0.1s;
        }

        button.main-btn:active { transform: translateY(5px); box-shadow: 0 0px 0px #B8A34A; }
        button.main-btn:disabled { background-color: #777; box-shadow: 0 5px 0px #444; color: #fff; cursor: not-allowed; }

        /* HUD */
        #hud {
            position: absolute; top: 20px; left: 20px; right: 20px;
            display: flex; justify-content: space-between; align-items: flex-start;
            z-index: 5; font-family: 'Fredoka One', cursive; font-size: 1.5rem; text-shadow: 2px 2px 0px #000;
        }

        .hud-player { display: flex; flex-direction: column; align-items: center; }
        .hud-player span.name { font-size: 0.9rem; margin-bottom: 5px; text-shadow: none; background: rgba(0,0,0,0.5); padding: 2px 8px; border-radius: 10px; }
        .hud-box { background: rgba(0,0,0,0.4); padding: 10px 20px; border-radius: 20px; border: 2px solid rgba(255,255,255,0.2); }
        
        #hud-p1 .hud-box { border-color: var(--p1-color); color: var(--p1-color); }
        #hud-p2 .hud-box { border-color: var(--p2-color); color: var(--p2-color); }

        /* Leaderboard Table */
        table { width: 100%; max-width: 400px; border-collapse: collapse; margin-bottom: 20px; background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden; }
        th, td { padding: 12px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.2); }
        th { background: var(--warning); color: var(--dark); }
        tr:nth-child(1) td { color: #FFD700; font-weight: bold; } 
        tr:nth-child(2) td { color: #C0C0C0; font-weight: bold; } 
        tr:nth-child(3) td { color: #CD7F32; font-weight: bold; } 

    </style>
</head>
<body>

    <div id="game-container">
        
        <video id="webcam" autoplay playsinline></video>
        <canvas id="game-canvas"></canvas>

        <!-- HUD (Score & Waktu) -->
        <div id="hud" class="hidden">
            <div class="hud-player" id="hud-p1">
                <span class="name" id="name-p1-display">Pemain 1</span>
                <div class="hud-box"><span id="score-p1">0</span></div>
            </div>
            
            <div class="hud-box" style="color: var(--warning); font-size: 1.8rem;">⏳ <span id="time-display">60</span></div>
            
            <div class="hud-player" id="hud-p2">
                <span class="name" id="name-p2-display">Pemain 2</span>
                <div class="hud-box"><span id="score-p2">0</span></div>
            </div>
        </div>

        <!-- LAYAR AWAL: Menu Utama -->
        <div id="start-screen" class="screen">
            <h1>Game Makan AR!</h1>
            
            <div class="mode-selector">
                <button id="btn-mode-1" class="mode-btn active-mode">👤 1 Pemain</button>
                <button id="btn-mode-2" class="mode-btn">👥 2 Pemain (Duel)</button>
            </div>

            <div class="instruction-box">
                <p id="instruction-text" style="font-size: 0.95rem; color: #ccc; margin-bottom: 10px;">
                   🍕 <b>Makanan (+10 Poin)</b> | 💣 <b>Bom/Sampah (-15 Poin)</b>
                </p>
                <p style="font-size: 0.9rem; color: var(--warning); margin-bottom: 0;">
                   Buka mulut untuk membidik, lalu <b>Tutup Mulutmu</b> saat makanan tepat di bibir!
                </p>
            </div>
            
            <div class="input-group">
                <input type="text" id="player1-name" placeholder="Nama Pemain" autocomplete="off" maxlength="12">
                <input type="text" id="player2-name" placeholder="Nama P2 (Kanan)" autocomplete="off" maxlength="12">
            </div>
            
            <button id="btn-init-camera" class="main-btn">Aktifkan Kamera Dulu</button>
            <p id="loading-status" style="margin-top: 15px; font-size: 0.9rem; color: var(--warning); display: none;">
                Sedang memuat model AI (Tunggu sebentar)...
            </p>
        </div>

        <!-- LAYAR AKHIR: Hasil & Leaderboard -->
        <div id="end-screen" class="screen hidden">
            <h1 id="end-title">Waktu Habis!</h1>
            <h2 style="color: #fff; margin-bottom: 5px;">Skor: <span id="final-score">0</span></h2>
            <p id="sync-status" style="font-size: 0.9rem; color: #aaa;">Menyimpan skor ke database...</p>
            
            <table id="leaderboard-table">
                <thead>
                    <tr>
                        <th>Peringkat</th>
                        <th>Nama Jagoan</th>
                        <th>Skor</th>
                    </tr>
                </thead>
                <tbody id="leaderboard-body">
                    <!-- Data Leaderboard -->
                </tbody>
            </table>

            <button onclick="location.reload()" class="main-btn">Main Lagi</button>
        </div>

    </div>

    <script>
        // --- KONFIGURASI WEB APP URL ---
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyContohWebURLSilahkanDigantiDenganMilikAnda/exec';
        const GAME_DURATION = 60; // Detik

        // --- Variabel Game ---
        let gameMode = 1; // 1 = Solo, 2 = Duel
        let p1Name = "Pemain 1", p2Name = "Pemain 2";
        let score1 = 0, score2 = 0;
        let timeLeft = GAME_DURATION;
        let gameActive = false;
        let items = [];
        let floatingTexts = [];
        
        let mouthWasOpen1 = false;
        let mouthWasOpen2 = false;

        // --- Event Listener Mode Pilihan ---
        const btnMode1 = document.getElementById('btn-mode-1');
        const btnMode2 = document.getElementById('btn-mode-2');
        const inputP1 = document.getElementById('player1-name');
        const inputP2 = document.getElementById('player2-name');

        btnMode1.addEventListener('click', () => {
            gameMode = 1;
            btnMode1.classList.add('active-mode');
            btnMode2.classList.remove('active-mode');
            inputP2.style.display = 'none';
            inputP1.placeholder = "Nama Pemain";
        });

        btnMode2.addEventListener('click', () => {
            gameMode = 2;
            btnMode2.classList.add('active-mode');
            btnMode1.classList.remove('active-mode');
            inputP2.style.display = 'inline-block';
            inputP1.placeholder = "Nama P1 (Kiri)";
        });
        
        // --- Sistem Suara (Web Audio API) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;
            
            if (type === 'eatGood') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(600, now); osc.frequency.exponentialRampToValueAtTime(1200, now + 0.15);
                gain.gain.setValueAtTime(0.5, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.start(now); osc.stop(now + 0.15);
            } else if (type === 'eatBad') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(250, now); osc.frequency.exponentialRampToValueAtTime(100, now + 0.3);
                gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            } else if (type === 'gameOver') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(400, now); osc.frequency.exponentialRampToValueAtTime(50, now + 1.0);
                gain.gain.setValueAtTime(0.5, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 1.0);
                osc.start(now); osc.stop(now + 1.0);
            }
        }

        // --- Referensi DOM ---
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('game-canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const startScreen = document.getElementById('start-screen');
        const endScreen = document.getElementById('end-screen');
        const hud = document.getElementById('hud');
        
        // --- Aset Emoji ---
        const goodFoods = ['🍕', '🍔', '🍟', '🌭', '🍩', '🍪', '🍫', '🍓', '🍉', '🍗'];
        const badFoods = ['💣', '🕷️', '💩', '🪨', '🌶️'];

        function resizeCanvas() { canvasElement.width = canvasElement.clientWidth; canvasElement.height = canvasElement.clientHeight; }
        window.addEventListener('resize', resizeCanvas); resizeCanvas();

        class FloatingText {
            constructor(x, y, text, color) {
                this.x = x; this.y = y; this.text = text; this.color = color;
                this.alpha = 1.0; this.velocity = -2;
            }
            update() { this.y += this.velocity; this.alpha -= 0.02; }
            draw(ctx) {
                ctx.save(); ctx.globalAlpha = this.alpha; ctx.font = "bold 24px 'Fredoka One'";
                ctx.fillStyle = this.color; ctx.strokeStyle = "white"; ctx.lineWidth = 3;
                ctx.strokeText(this.text, this.x, this.y); ctx.fillText(this.text, this.x, this.y);
                ctx.restore();
            }
        }

        function spawnItem() {
            if (!gameActive) return;
            const isGood = Math.random() > 0.3; 
            const emojiArr = isGood ? goodFoods : badFoods;
            const emoji = emojiArr[Math.floor(Math.random() * emojiArr.length)];
            
            const x = 0.1 + (Math.random() * 0.8);
            const speed = 0.005 + (Math.random() * 0.008); 

            items.push({ id: Date.now(), emoji: emoji, isGood: isGood, x: x, y: -0.1, speed: speed, targeted1: false, targeted2: false });
        }

        function eatItem(index, playerNum, mouthX, mouthY) {
            const item = items[index];
            const pointChange = item.isGood ? 10 : -15;
            const color = item.isGood ? "#4ECDC4" : "#FF6B6B";
            const text = pointChange > 0 ? `+10` : `-15`;

            if (playerNum === 1) {
                score1 += pointChange;
                document.getElementById('score-p1').innerText = score1;
            } else {
                score2 += pointChange;
                document.getElementById('score-p2').innerText = score2;
            }

            playSound(item.isGood ? 'eatGood' : 'eatBad');
            floatingTexts.push(new FloatingText(mouthX, mouthY - 30, text, color));
            items.splice(index, 1);
        }

        function endGame() {
            gameActive = false;
            hud.classList.add('hidden');
            endScreen.classList.remove('hidden');
            playSound('gameOver');

            let winnerName = "";
            let winnerScore = 0;
            let titleText = "";

            if (gameMode === 1) {
                winnerName = p1Name;
                winnerScore = score1;
                titleText = "Waktu Habis!";
            } else {
                if (score1 > score2) {
                    winnerName = p1Name; winnerScore = score1; titleText = `🎉 ${winnerName} Menang! 🎉`;
                } else if (score2 > score1) {
                    winnerName = p2Name; winnerScore = score2; titleText = `🎉 ${winnerName} Menang! 🎉`;
                } else {
                    winnerName = "Seri"; winnerScore = score1; titleText = "🤝 Pertandingan Seri! 🤝";
                }
            }

            document.getElementById('end-title').innerText = titleText;
            document.getElementById('final-score').innerText = winnerScore;

            if (winnerName === "Seri") {
                document.getElementById('sync-status').innerText = "Seri! Tidak ada skor yang dimasukkan ke database.";
            }

            submitScoreToGAS(winnerName, winnerScore);
        }

        function startTimer() {
            const timerInterval = setInterval(() => {
                if (!gameActive) return clearInterval(timerInterval);
                timeLeft--; document.getElementById('time-display').innerText = timeLeft;
                if (timeLeft <= 0) { clearInterval(timerInterval); endGame(); }
            }, 1000);

            function spawner() {
                if (!gameActive) return;
                spawnItem(); 
                const spawnRate = gameMode === 2 ? 500 : 750;
                setTimeout(spawner, spawnRate + Math.random() * 600); 
            }
            spawner();
        }

        async function submitScoreToGAS(name, finalScore) {
            const syncStatus = document.getElementById('sync-status');
            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ nama: name, skor: finalScore })
                });
                const data = await response.json();
                
                if (data && data.leaderboard) {
                    if(name !== "Seri") syncStatus.innerText = "Data berhasil disimpan di Database!";
                    syncStatus.style.color = "var(--p2-color)";
                    renderLeaderboard(data.leaderboard);
                } else throw new Error("Format respons tidak sesuai");
            } catch (error) {
                console.error('Error:', error);
                if(name !== "Seri") syncStatus.innerText = "Gagal terhubung ke database. (Menampilkan Data Lokal)";
                syncStatus.style.color = "var(--p1-color)";
                renderLeaderboard([
                    {nama: name !== "Seri" ? name : p1Name, skor: finalScore},
                    {nama: "Si Jago", skor: 250}, {nama: "Raja Makan", skor: 180}, {nama: "Si Lambat", skor: -20}
                ].sort((a,b) => b.skor - a.skor));
            }
        }

        function renderLeaderboard(boardData) {
            const tbody = document.getElementById('leaderboard-body');
            tbody.innerHTML = '';
            boardData.forEach((player, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td>#${index + 1}</td><td>${player.nama}</td><td>${player.skor}</td>`;
                tbody.appendChild(tr);
            });
        }

        // --- MediaPipe Face Mesh Initialization ---
        const faceMesh = new FaceMesh({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}` });
        
        faceMesh.setOptions({
            maxNumFaces: 2, 
            refineLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5
        });

        faceMesh.onResults((results) => {
            const btnInit = document.getElementById('btn-init-camera');
            if (!gameActive && !startScreen.classList.contains('hidden') && btnInit.disabled) {
                document.getElementById('loading-status').style.display = 'none';
                btnInit.innerText = gameMode === 1 ? "Mulai Permainan!" : "Mulai Duel!";
                btnInit.style.backgroundColor = "var(--p2-color)";
                btnInit.disabled = false;
                btnInit.onclick = () => {
                    if (audioCtx.state === 'suspended') audioCtx.resume();
                    
                    p1Name = document.getElementById('player1-name').value.trim() || "Pemain 1";
                    document.getElementById('name-p1-display').innerText = p1Name;

                    if (gameMode === 2) {
                        p2Name = document.getElementById('player2-name').value.trim() || "Pemain 2";
                        document.getElementById('name-p2-display').innerText = p2Name;
                        document.getElementById('hud-p2').style.display = 'flex';
                    } else {
                        document.getElementById('hud-p2').style.display = 'none';
                    }

                    startScreen.classList.add('hidden'); hud.classList.remove('hidden');
                    gameActive = true; startTimer();
                };
            }

            const w = canvasElement.width; const h = canvasElement.height;
            canvasCtx.clearRect(0, 0, w, h);
            
            canvasCtx.save(); canvasCtx.translate(w, 0); canvasCtx.scale(-1, 1);
            canvasCtx.drawImage(results.image, 0, 0, w, h); canvasCtx.restore();

            canvasCtx.fillStyle = 'rgba(0,0,0,0.3)'; canvasCtx.fillRect(0,0,w,h);

            // --- Logika Pemisahan 1 atau 2 Pemain ---
            let currentP1 = null; 
            let currentP2 = null; 

            if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                
                let faces = [];
                // Menambahkan safety check (pengecekan keamanan) untuk mencegah error undefined
                results.multiFaceLandmarks.forEach(lm => {
                    if (lm && lm[13] && lm[14] && lm[61] && lm[291]) {
                        const topLip = lm[13], bottomLip = lm[14], leftMouth = lm[61], rightMouth = lm[291];
                        const mX = (1 - ((topLip.x + bottomLip.x) / 2)) * w; 
                        const mY = ((topLip.y + bottomLip.y) / 2) * h;
                        const mH = Math.hypot(bottomLip.x - topLip.x, bottomLip.y - topLip.y);
                        const mW = Math.hypot(rightMouth.x - leftMouth.x, rightMouth.y - leftMouth.y);
                        const isOpen = (mH / mW) > 0.15;
                        faces.push({ mX, mY, isOpen });
                    }
                });

                faces.sort((a, b) => a.mX - b.mX);

                if (faces.length > 0) {
                    if (gameMode === 1) {
                        currentP1 = faces[0];
                    } else {
                        if (faces.length === 1) {
                            if (faces[0].mX < w / 2) currentP1 = faces[0]; else currentP2 = faces[0];
                        } else if (faces.length >= 2) {
                            currentP1 = faces[0]; 
                            currentP2 = faces[1]; 
                        }
                    }
                }

                // Render P1
                if (currentP1) {
                    canvasCtx.beginPath(); canvasCtx.arc(currentP1.mX, currentP1.mY, 40, 0, 2 * Math.PI); canvasCtx.lineWidth = 4;
                    canvasCtx.strokeStyle = currentP1.isOpen ? 'var(--p1-color)' : 'var(--warning)';
                    canvasCtx.fillStyle = currentP1.isOpen ? 'rgba(255, 107, 107, 0.2)' : 'rgba(255, 230, 109, 0.2)';
                    canvasCtx.stroke(); canvasCtx.fill();
                }

                // Render P2
                if (currentP2 && gameMode === 2) {
                    canvasCtx.beginPath(); canvasCtx.arc(currentP2.mX, currentP2.mY, 40, 0, 2 * Math.PI); canvasCtx.lineWidth = 4;
                    canvasCtx.strokeStyle = currentP2.isOpen ? 'var(--p2-color)' : 'var(--warning)';
                    canvasCtx.fillStyle = currentP2.isOpen ? 'rgba(78, 205, 196, 0.2)' : 'rgba(255, 230, 109, 0.2)';
                    canvasCtx.stroke(); canvasCtx.fill();
                }
            }

            if (gameActive) {
                for (let i = items.length - 1; i >= 0; i--) {
                    items[i].y += items[i].speed;
                    if (items[i].y > 1.1) items.splice(i, 1);
                }

                for (let i = floatingTexts.length - 1; i >= 0; i--) {
                    floatingTexts[i].update();
                    if (floatingTexts[i].alpha <= 0) floatingTexts.splice(i, 1);
                }

                for (let i = items.length - 1; i >= 0; i--) {
                    const item = items[i];
                    const itemPixelX = item.x * w; const itemPixelY = item.y * h;

                    canvasCtx.globalAlpha = 1.0; canvasCtx.fillStyle = "#FFFFFF";
                    canvasCtx.font = "40px Arial"; canvasCtx.textAlign = "center"; canvasCtx.textBaseline = "middle";
                    canvasCtx.fillText(item.emoji, itemPixelX, itemPixelY);

                    item.targeted1 = false; item.targeted2 = false;
                    const radius = 50;

                    if (currentP1 && Math.hypot(itemPixelX - currentP1.mX, itemPixelY - currentP1.mY) < radius) {
                        item.targeted1 = true;
                    }
                    if (currentP2 && gameMode === 2 && Math.hypot(itemPixelX - currentP2.mX, itemPixelY - currentP2.mY) < radius) {
                        item.targeted2 = true;
                    }

                    if (item.targeted1 || item.targeted2) {
                        canvasCtx.beginPath(); canvasCtx.arc(itemPixelX, itemPixelY, 30, 0, 2 * Math.PI);
                        canvasCtx.strokeStyle = item.targeted1 ? 'var(--p1-color)' : 'var(--p2-color)';
                        canvasCtx.lineWidth = 3; canvasCtx.setLineDash([5, 5]); canvasCtx.stroke(); canvasCtx.setLineDash([]);
                    }

                    // Eksekusi "Hap!"
                    if (item.targeted1 && mouthWasOpen1 && (!currentP1 || !currentP1.isOpen)) {
                        eatItem(i, 1, currentP1.mX, currentP1.mY);
                    } else if (item.targeted2 && mouthWasOpen2 && (!currentP2 || !currentP2.isOpen)) {
                        eatItem(i, 2, currentP2.mX, currentP2.mY);
                    }
                }
                
                floatingTexts.forEach(ft => ft.draw(canvasCtx));
            }

            mouthWasOpen1 = currentP1 ? currentP1.isOpen : false;
            mouthWasOpen2 = currentP2 ? currentP2.isOpen : false;
        });

        // --- Inisialisasi Kamera ---
        const camera = new Camera(videoElement, {
            onFrame: async () => { await faceMesh.send({image: videoElement}); },
            width: 640, height: 480
        });

        document.getElementById('btn-init-camera').addEventListener('click', () => {
            const btn = document.getElementById('btn-init-camera');
            btn.innerText = "Meminta Izin Kamera..."; btn.disabled = true;
            document.getElementById('loading-status').style.display = 'block';

            camera.start().catch((err) => {
                alert("Kamera tidak dapat diakses! Pastikan Anda memberikan izin.");
                btn.innerText = "Aktifkan Kamera Dulu"; btn.disabled = false;
                document.getElementById('loading-status').style.display = 'none';
            });
        });

    </script>
</body>
</html>
